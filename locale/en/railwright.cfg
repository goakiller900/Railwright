dynamic-station-name-tooltip=Include a dedicated Railwright combinator and derive the station name from exactly one positive item or fluid signal supplied to its input. The Station name field remains the textual base or suffix.
transfer-mode-tooltip=Use conventional inserters or compatible compact loaders between wagons, chests, and belts.
loader-tooltip=Select a loader-1x1 prototype. Deadlock loader tiers normally match their transport-belt tier.
