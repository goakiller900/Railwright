[mod-setting-name]
railwright-enable-experimental-diagonal=Show experimental diagonal stacker option
railwright-enable-experimental-dynamic-station-names=[Experimental] Dynamic station names

[mod-setting-description]
railwright-enable-experimental-diagonal=Shows the experimental diagonal stacker checkbox in the Railwright stacker configuration. Enabled by default; disable this setting to hide diagonal generation.
railwright-enable-experimental-dynamic-station-names=Experimental and disabled by default. Enable this setting to show the Dynamic station name checkbox in Railwright's item and fluid station configuration. The checkbox remains off by default and controls whether a newly generated station includes the dedicated naming combinator. Existing generated stations are not changed.
